<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Fynlo, pencatat keuangan pribadi" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Fynlo</title>
    <script>
      // Dipasang sebelum render supaya tema gelap tidak berkedip terang saat dimuat.
      try {
        if (localStorage.getItem('fynlo-theme') === 'dark') document.documentElement.classList.add('dark')
      } catch {}
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
